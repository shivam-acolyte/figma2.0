<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FigCraft</title>
  <link data-trunk rel="rust" data-bin="figcraft-web" data-cargo-profile="web-release" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    #figcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #figcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #6b6b6b; font: 14px system-ui, sans-serif; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #2c2c2c; }
      #figcraft_loading { color: #b8b8b8; }
    }
  </style>
</head>
<body>
  <canvas id="figcraft_canvas"></canvas>
  <script>
    (function() {
      // Backend wake-up & keep-alive: ping /healthz if a collab server is configured
      const serverUrl = window.localStorage.getItem('figcraft_collab_server') || window.__FIGCRAFT_SERVER_URL__;
      if (serverUrl) {
        const httpUrl = serverUrl.replace(/^wss:\/\//i, 'https://').replace(/^ws:\/\//i, 'http://').replace(/\/+$/, '') + '/healthz';
        fetch(httpUrl, { mode: 'no-cors' }).catch(() => {});
        setInterval(() => {
          fetch(httpUrl, { mode: 'no-cors' }).catch(() => {});
        }, 10 * 60 * 1000);
      }
    })();
  </script>
</body>
</html>
