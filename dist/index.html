<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FigCraft</title>
  
<script type="module">
import init, * as bindings from './figcraft-web-892f9c07db2cc016.js';
const wasm = await init({ module_or_path: './figcraft-web-892f9c07db2cc016_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    #figcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #figcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #6b6b6b; font: 14px system-ui, sans-serif; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #2c2c2c; }
      #figcraft_loading { color: #b8b8b8; }
    }
  </style>
<link rel="modulepreload" href="./figcraft-web-892f9c07db2cc016.js" crossorigin="anonymous" integrity="sha384-Jd1koLvi35vj7uHDxr2mDWd9WRPGy0a3c3ihTwpvhtxrQSgKmmtfEtPX4C3++/Wd"><link rel="preload" href="./figcraft-web-892f9c07db2cc016_bg.wasm" crossorigin="anonymous" integrity="sha384-aY2MS7EqvRg8h761dJJfA+rY60I5ttbqSQyaipKYPU/ObxfXdR9jSKbAnTNJA9qR" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="figcraft_canvas"></canvas>
  <script>
    (function() {
      // Backend wake-up & keep-alive: ping /healthz on load and periodically
      window.__FIGCRAFT_SERVER_URL__ = "wss://figma2-0.onrender.com";
      const serverUrl = window.localStorage.getItem('figcraft_collab_server') || window.__FIGCRAFT_SERVER_URL__;
      if (serverUrl) {
        const httpUrl = serverUrl.replace(/^wss:\/\//i, 'https://').replace(/^ws:\/\//i, 'http://').replace(/\/+$/, '') + '/healthz';
        // Ping immediately to warm up the backend
        fetch(httpUrl, { mode: 'no-cors' }).catch(() => {});
        // Recurring ping every 10 minutes to prevent sleep
        setInterval(() => {
          fetch(httpUrl, { mode: 'no-cors' }).catch(() => {});
        }, 10 * 60 * 1000);
      }
    })();
  </script>
</body>
</html>
